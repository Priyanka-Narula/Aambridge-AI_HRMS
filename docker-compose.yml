services:
  postgres:
    image: postgres:16-alpine
    container_name: hrms-postgres
    restart: "no"
    environment:
      POSTGRES_USER: hrms
      POSTGRES_PASSWORD: hrms
      POSTGRES_DB: hrms
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hrms -d hrms"]
      interval: 30s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"

  minio:
    image: minio/minio:RELEASE.2025-01-20T14-49-07Z
    container_name: hrms-minio
    restart: "no"
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: hrms
      MINIO_ROOT_PASSWORD: hrms_minio_secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.25"

  minio-init:
    image: minio/mc:latest
    container_name: hrms-minio-init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 3 &&
      mc alias set local http://minio:9000 hrms hrms_minio_secret &&
      mc mb local/hrms-cvs --ignore-existing &&
      mc anonymous set none local/hrms-cvs
      "
    restart: "no"

volumes:
  postgres_data:
  minio_data:
